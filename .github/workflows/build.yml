name: build

# Regenerates every file derived from zshrc.org and commits it back:
#   .zshrc .zshenv home.zshenv .profile zimrc .p10k.zsh  (tools/tangle.py, syntax-checked)
#   README.md                                            (tools/build-readme.py, via pandoc)
on:
  push:
    branches: [main]
    paths:
      - zshrc.org
      - tools/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and pandoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh pandoc

      - name: Tangle and syntax-check (zsh -n)
        run: python3 tools/tangle.py --check zshrc.org .

      - name: Build README.md
        run: python3 tools/build-readme.py zshrc.org README.md

      - name: Commit regenerated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .zshrc .zshenv home.zshenv .profile zimrc .p10k.zsh README.md
          if git diff --cached --quiet; then
            echo "generated files already up to date"
          else
            git commit -m "ci: regenerate from zshrc.org [skip ci]"
            git push
          fi
